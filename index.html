<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Pumpkin Carver</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cellipse cx=%2732%27 cy=%2738%27 rx=%2728%27 ry=%2222%27 fill=%27%23f57a1c%27/%3E%3Cpath d=%27M30 17q2-9 8-11l3 3q-5 3-6 9z%27 fill=%27%234d6a1a%27/%3E%3Cpath d=%27M16 34l6-9 6 9zM36 34l6-9 6 9zM18 44q14 8 28 0q-4 9-14 9t-14-9z%27 fill=%27%23ffd36b%27/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #120c24; --panel: rgba(30, 20, 52, 0.86); --line: rgba(255, 190, 120, 0.18);
    --orange: #ff8a1f; --glow: #ffcf6b; --text: #fff4e6; --muted: #c9b6d8;
    --round: ui-rounded, "SF Pro Rounded", "Avenir Next", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: var(--round); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px 6px; z-index: 2; }
  .title { flex: 1; min-width: 0; }
  .title h1 { margin: 0; font-size: clamp(22px, 4.6vw, 34px); font-weight: 900; letter-spacing: .5px; line-height: 1;
    background: linear-gradient(180deg, #ffe08a 0%, #ff9a2e 55%, #e2560c 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 140, 30, .45)); }
  .title p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lightsBtn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px 8px 10px;
    background: linear-gradient(180deg, #3b2766, #251744); color: var(--text); font: 800 14px var(--round); cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.35); transition: transform .12s, background .3s; }
  #lightsBtn:active { transform: scale(.95); }
  #lightsBtn .sw { width: 34px; height: 20px; border-radius: 10px; background: #f6d36b; position: relative; transition: background .3s; box-shadow: inset 0 1px 3px rgba(0,0,0,.3); }
  #lightsBtn .sw::after { content: ""; position: absolute; top: 2px; left: 16px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .25s; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  body.dark #lightsBtn { background: linear-gradient(180deg, #ff9a2e, #d9540b); border-color: #ffc46b; box-shadow: 0 0 18px rgba(255,140,30,.55); }
  body.dark #lightsBtn .sw { background: #2a1a10; }
  body.dark #lightsBtn .sw::after { left: 2px; background: #ffcf6b; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: crosshair; }
  #hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); pointer-events: none; font-size: 13.5px; font-weight: 700;
    color: #ffe9c9; background: rgba(18, 10, 34, .72); border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; white-space: nowrap;
    transition: opacity .4s; max-width: 94%; overflow: hidden; text-overflow: ellipsis; }
  #toast { position: absolute; left: 50%; top: 14px; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; transition: all .25s;
    background: #ff8a1f; color: #2a1200; font-weight: 900; padding: 8px 16px; border-radius: 999px; box-shadow: 0 6px 20px rgba(255,120,20,.45); font-size: 14px; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; z-index: 2;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .row { display: flex; align-items: center; gap: 8px; }
  .tools { overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; justify-content: safe center; }
  .tools::-webkit-scrollbar { display: none; }
  .tool { flex: 0 0 auto; width: 62px; height: 62px; border-radius: 16px; border: 2px solid transparent; background: rgba(255,255,255,.06);
    color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 0;
    font: 800 11px var(--round); transition: transform .1s, background .2s, border-color .2s; }
  .tool canvas { width: 34px; height: 34px; }
  .tool:active { transform: scale(.93); }
  .tool.on { border-color: var(--orange); background: rgba(255, 138, 31, .2); box-shadow: 0 0 14px rgba(255,138,31,.35); }
  .sizebox { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 120px; font-size: 12px; font-weight: 800; color: var(--muted); }
  .sizebox span { white-space: nowrap; min-width: 62px; }
  input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 30px; background: transparent; min-width: 60px; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #5b3a1a, #ff8a1f); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 50%; background: #ffe2a8; border: 3px solid #ff8a1f; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #5b3a1a, #ff8a1f); }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #ffe2a8; border: 3px solid #ff8a1f; }
  .btn { flex: 0 0 auto; height: 44px; border-radius: 13px; border: 1px solid var(--line); background: rgba(255,255,255,.07); color: var(--text);
    font: 800 13.5px var(--round); padding: 0 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: transform .1s, opacity .2s; }
  .btn svg { width: 19px; height: 19px; flex: 0 0 auto; }
  .btn:active { transform: scale(.94); }
  .btn:disabled { opacity: .35; }
  .btn.save { background: linear-gradient(180deg, #ffad4a, #e8650f); color: #2a1200; border-color: #ffc77a; }
  .btn.fun { background: linear-gradient(180deg, #7a4fd1, #5532a8); border-color: #a888f0; }
  .picker { justify-content: center; flex-wrap: wrap; gap: 6px 14px; }
  .group { display: flex; align-items: center; gap: 6px; }
  .group label { font-size: 11.5px; font-weight: 800; color: var(--muted); margin-right: 2px; text-transform: uppercase; letter-spacing: .6px; }
  .chip { height: 36px; min-width: 44px; border-radius: 11px; border: 2px solid transparent; background: rgba(255,255,255,.07); color: var(--text);
    font: 800 12.5px var(--round); padding: 0 6px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .chip canvas { width: 26px; height: 26px; }
  .chip.on { border-color: var(--orange); background: rgba(255,138,31,.18); }
  .swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); cursor: pointer; padding: 0; transition: transform .1s; }
  .swatch.on { border-color: #fff; transform: scale(1.08); box-shadow: 0 0 12px rgba(255,255,255,.35); }
  @media (max-width: 520px) {
    .btn .lbl { display: none; } .btn { padding: 0 11px; }
    .btn.save .lbl { display: inline; }
    .tools { gap: 4px; }
    .tool { flex: 1 1 0; width: auto; min-width: 0; max-width: 62px; height: 56px; border-radius: 13px; font-size: 10.5px; }
    .tool canvas { width: 30px; height: 30px; }
    .sizebox { min-width: 0; gap: 6px; } .sizebox span { min-width: 0; }
    .row { gap: 6px; }
    .title p { font-size: 11.5px; }
  }
  @media (min-width: 960px) {
    footer { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .tools { justify-content: center; }
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>Pumpkin Carver</h1>
    <p id="tagline">Carve it. Light it. Save it. Happy Halloween, Char &amp; Vic!</p>
  </div>
  <button id="lightsBtn" aria-pressed="false" title="Lights off (L)"><span class="sw"></span><span id="lightsLbl">Lights off</span></button>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Pumpkin carving canvas"></canvas>
  <div id="hint">Drag on the pumpkin to carve</div>
  <div id="toast"></div>
</div>
<footer>
  <div class="row tools" id="tools"></div>
  <div class="row">
    <div class="sizebox"><span id="sizeLbl">Knife size</span><input id="size" type="range" min="0" max="100" value="45" aria-label="Size"></div>
    <button class="btn" id="undoBtn" title="Undo (Ctrl/Cmd+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg><span class="lbl">Undo</span></button>
    <button class="btn" id="clearBtn" title="Fresh pumpkin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span class="lbl">Clear</span></button>
    <button class="btn fun" id="surpriseBtn" title="Carve a random face"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.3L21 9l-5.3 4 1.9 6.6L12 15.8 6.4 19.6 8.3 13 3 9l6.8-.7z"/></svg><span class="lbl">Surprise</span></button>
    <button class="btn save" id="saveBtn" title="Save PNG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg><span class="lbl">Save</span></button>
  </div>
  <div class="row picker">
    <div class="group" id="shapes"><label>Shape</label></div>
    <div class="group" id="colors"><label>Color</label></div>
  </div>
</footer>
<script>
(() => {
'use strict';
// ---------- config ----------
const SHAPES = {
  round: { name: 'Round', sx: 1.12, sy: 0.9 },
  tall:  { name: 'Tall',  sx: 0.86, sy: 1.08 },
  squat: { name: 'Squat', sx: 1.32, sy: 0.72 },
};
const COLORS = {
  classic: { name: 'Classic', light: '#ffb75a', base: '#f57a1c', dark: '#9a3a05', edge: 'rgba(90,25,0,.35)', flesh: '#ffc062', fleshDark: '#d9822c', stem: ['#7d8f2c', '#3e4f12'] },
  ruby:    { name: 'Cinderella', light: '#ff8f5a', base: '#dd4318', dark: '#6e1704', edge: 'rgba(70,10,0,.4)', flesh: '#ffb15c', fleshDark: '#cf6a24', stem: ['#6f7a2a', '#36400f'] },
  ghost:   { name: 'Ghost', light: '#ffffff', base: '#ece5d6', dark: '#a39783', edge: 'rgba(70,55,35,.3)', flesh: '#ffd27a', fleshDark: '#e09a3a', stem: ['#8a8a5a', '#4a4a2a'] },
  goblin:  { name: 'Goblin', light: '#a9d16a', base: '#5f9137', dark: '#22401a', edge: 'rgba(10,35,5,.4)', flesh: '#ffcf6a', fleshDark: '#d18a2c', stem: ['#8a6a3a', '#4a3416'] },
};
const LOBES = [ // offset x, half-width, half-height (pumpkin units)
  [-0.62, 0.42, 0.86], [0.62, 0.42, 0.86], [-0.33, 0.55, 0.95], [0.33, 0.55, 0.95], [0, 0.58, 1.0],
];
const STAMPS = {
  eyes: { name: 'Eyes', base: 0.5 }, nose: { name: 'Nose', base: 0.17 }, grin: { name: 'Grin', base: 0.55 },
  cat: { name: 'Cat', base: 0.3 }, bat: { name: 'Bat', base: 0.34 }, star: { name: 'Star', base: 0.19 }, moon: { name: 'Moon', base: 0.2 },
};

// ---------- state ----------
const S = {
  tool: 'knife', shape: 'round', color: 'classic', lights: true,
  size: { knife: 45, stamp: 50 }, ops: [], stroke: null, preview: null,
  W: 0, H: 0, dpr: 1, cx: 0, cy: 0, R: 100, coverage: 0, t0: performance.now(),
};
const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const mk = () => document.createElement('canvas');
const staticC = mk(), maskC = mk(), clipC = mk(), glowC = mk(), fleshC = mk(), haloC = mk(), scratchC = mk(), covC = mk();
covC.width = covC.height = 48;
let LW = 0, LH = 0; // local work canvas size (device px)
const LOX = 1.55, LOY = 1.45; // local origin offset in pumpkin units

// seeded rng
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------- geometry ----------
function unitXf(c) { // pumpkin-unit transform on a local canvas
  const k = S.R * S.dpr; c.setTransform(k, 0, 0, k, LOX * k, LOY * k);
}
function bodyPath(c, shrink = 1) {
  const sh = SHAPES[S.shape];
  c.beginPath();
  for (const [ox, w, h] of LOBES) {
    c.moveTo(ox * sh.sx + w * sh.sx * shrink, 0);
    c.ellipse(ox * sh.sx, 0, w * sh.sx * shrink, h * sh.sy * shrink, 0, 0, Math.PI * 2);
  }
}
function toUnit(x, y) { return [(x - S.cx) / S.R, (y - S.cy) / S.R]; }
function toScreen(u, v) { return [S.cx + u * S.R, S.cy + v * S.R]; }

// ---------- stamps (unit paths, ~[-1,1]) ----------
function tri(c, pts) { c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
function starPath(c, cx, cy, ro, ri, n = 5) {
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? ri : ro, a = -Math.PI / 2 + i * Math.PI / n;
    i ? c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : c.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  c.closePath();
}
// draws a stamp shape (filled = carved) into c, already transformed to stamp space. Uses destination-out for cutouts.
function drawStampShape(c, kind, color = '#fff') {
  c.fillStyle = color; c.strokeStyle = color;
  c.beginPath();
  switch (kind) {
    case 'eyes':
      tri(c, [-0.98, 0.3, -0.24, 0.3, -0.56, -0.42]);
      tri(c, [0.24, 0.3, 0.98, 0.3, 0.56, -0.42]);
      c.fill(); break;
    case 'nose':
      tri(c, [-0.8, 0.6, 0.8, 0.6, 0, -0.7]); c.fill(); break;
    case 'grin': {
      const yU = (x) => -0.22 + 0.42 * x * x, yL = (x) => 0.52 - 0.32 * x * x;
      c.moveTo(-1, yU(-1));
      for (let x = -1; x <= 1.0001; x += 0.05) c.lineTo(x, yU(x));
      for (let x = 1; x >= -1.0001; x -= 0.05) c.lineTo(x, yL(x));
      c.closePath(); c.fill();
      c.globalCompositeOperation = 'destination-out';
      c.beginPath();
      for (const tx of [-0.42, 0.42]) c.rect(tx - 0.12, yU(tx) - 0.2, 0.24, 0.42);
      c.rect(-0.13, yL(0) - 0.3, 0.26, 0.4);
      for (const tx of [-0.72, 0.72]) c.rect(tx - 0.09, yL(tx) - 0.26, 0.18, 0.4);
      c.fill(); c.globalCompositeOperation = 'source-over';
      break;
    }
    case 'cat': {
      c.ellipse(0, 0.36, 0.5, 0.6, 0, 0, Math.PI * 2);
      c.moveTo(0.34, -0.38); c.arc(0, -0.38, 0.34, 0, Math.PI * 2);
      tri(c, [-0.33, -0.48, -0.27, -0.95, -0.04, -0.68]);
      tri(c, [0.33, -0.48, 0.27, -0.95, 0.04, -0.68]);
      c.fill();
      c.beginPath(); c.lineWidth = 0.15; c.lineCap = 'round';
      c.moveTo(0.38, 0.82); c.bezierCurveTo(0.95, 0.85, 0.98, 0.25, 0.72, -0.02); c.stroke();
      c.globalCompositeOperation = 'destination-out';
      c.beginPath(); c.ellipse(-0.13, -0.4, 0.07, 0.11, 0.25, 0, Math.PI * 2);
      c.moveTo(0.2, -0.4); c.ellipse(0.13, -0.4, 0.07, 0.11, -0.25, 0, Math.PI * 2); c.fill();
      c.globalCompositeOperation = 'source-over';
      break;
    }
    case 'bat': {
      c.moveTo(0, -0.12);
      c.lineTo(0.07, -0.34); c.lineTo(0.12, -0.14);
      c.quadraticCurveTo(0.42, -0.18, 0.62, -0.42);
      c.quadraticCurveTo(0.78, -0.2, 1.0, -0.22);
      c.quadraticCurveTo(0.86, -0.06, 0.88, 0.16);
      c.quadraticCurveTo(0.74, 0.02, 0.6, 0.12);
      c.quadraticCurveTo(0.52, 0.0, 0.36, 0.14);
      c.quadraticCurveTo(0.28, 0.06, 0.14, 0.16);
      c.quadraticCurveTo(0.08, 0.3, 0, 0.36);
      c.quadraticCurveTo(-0.08, 0.3, -0.14, 0.16);
      c.quadraticCurveTo(-0.28, 0.06, -0.36, 0.14);
      c.quadraticCurveTo(-0.52, 0.0, -0.6, 0.12);
      c.quadraticCurveTo(-0.74, 0.02, -0.88, 0.16);
      c.quadraticCurveTo(-0.86, -0.06, -1.0, -0.22);
      c.quadraticCurveTo(-0.78, -0.2, -0.62, -0.42);
      c.quadraticCurveTo(-0.42, -0.18, -0.12, -0.14);
      c.lineTo(-0.07, -0.34); c.closePath(); c.fill();
      break;
    }
    case 'star': starPath(c, 0, 0.06, 1, 0.42); c.fill(); break;
    case 'moon':
      c.arc(0, 0, 1, 0, Math.PI * 2); c.fill();
      c.globalCompositeOperation = 'destination-out';
      c.beginPath(); c.arc(0.42, -0.22, 0.86, 0, Math.PI * 2); c.fill();
      c.globalCompositeOperation = 'source-over'; break;
  }
}
function stampScale(v) { return 0.45 + (v / 100) * 1.35; } // slider 0..100 -> multiplier
function knifeWidth(v) { return 0.025 + (v / 100) * 0.15; }  // pumpkin units

// ---------- mask ops ----------
function drawOpOnMask(op) {
  const m = maskC.getContext('2d');
  if (op.type === 'stroke') {
    unitXf(m);
    m.globalCompositeOperation = 'source-over';
    m.strokeStyle = m.fillStyle = '#fff'; m.lineWidth = op.w; m.lineCap = 'round'; m.lineJoin = 'round';
    const p = op.pts;
    m.beginPath();
    if (p.length === 1) { m.arc(p[0][0], p[0][1], op.w / 2, 0, Math.PI * 2); m.fill(); }
    else {
      m.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < p.length - 1; i++) { const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2; m.quadraticCurveTo(p[i][0], p[i][1], mx, my); }
      m.lineTo(p[p.length - 1][0], p[p.length - 1][1]); m.stroke();
    }
  } else if (op.type === 'stamp') {
    const sc = scratchC.getContext('2d');
    sc.setTransform(1, 0, 0, 1, 0, 0); sc.clearRect(0, 0, LW, LH);
    unitXf(sc); sc.translate(op.x, op.y); const k = STAMPS[op.kind].base * op.s; sc.scale(k, k); if (op.flip) sc.scale(-1, 1);
    drawStampShape(sc, op.kind);
    m.setTransform(1, 0, 0, 1, 0, 0); m.globalCompositeOperation = 'source-over'; m.drawImage(scratchC, 0, 0);
  } else if (op.type === 'clear') {
    m.setTransform(1, 0, 0, 1, 0, 0); m.clearRect(0, 0, LW, LH);
  }
}
function applyClip() {
  const m = maskC.getContext('2d');
  m.setTransform(1, 0, 0, 1, 0, 0); m.globalCompositeOperation = 'destination-in'; m.drawImage(clipC, 0, 0); m.globalCompositeOperation = 'source-over';
}
function rebuildMask() {
  const m = maskC.getContext('2d');
  m.setTransform(1, 0, 0, 1, 0, 0); m.clearRect(0, 0, LW, LH);
  for (const op of S.ops) drawOpOnMask(op);
  applyClip(); derive();
}
function derive() {
  // flesh (cut wall) layer
  const f = fleshC.getContext('2d'), col = COLORS[S.color];
  f.setTransform(1, 0, 0, 1, 0, 0); f.clearRect(0, 0, LW, LH); f.globalCompositeOperation = 'source-over';
  f.drawImage(maskC, 0, 0);
  f.globalCompositeOperation = 'source-in';
  unitXf(f);
  const g = f.createLinearGradient(0, -1.1, 0, 1.1); g.addColorStop(0, col.flesh); g.addColorStop(1, col.fleshDark);
  f.fillStyle = g; f.fillRect(-LOX, -LOY, LOX * 2, LOY * 2);
  // darker rim at outer edge of cut: draw mask slightly expanded underneath via shadow
  f.setTransform(1, 0, 0, 1, 0, 0); f.globalCompositeOperation = 'destination-over';

      s: 3 + Math.random() * 5, life: 1 + Math.random() * 0.6, col: Math.random() < 0.5 ? col.base : col.flesh, g: Math.random() * S.R * 0.12 });
  }
}

// ---------- input ----------
let activeId = null;
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', (e) => {
  if (activeId !== null) return;
  activeId = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
  const [x, y] = evPos(e), [u, v] = toUnit(x, y);
  S.preview = [u, v];
  if (S.tool === 'knife') {
    S.stroke = { type: 'stroke', w: knifeWidth(S.size.knife), pts: [[u, v]] };
    S.ops.push(S.stroke); drawOpOnMask(S.stroke); applyClip(); derive(); spawnChips(x, y, 4);
  }
  hideHint();
});
cv.addEventListener('pointermove', (e) => {
  const [x, y] = evPos(e), [u, v] = toUnit(x, y);
  if (activeId === null) { S.preview = e.pointerType === 'mouse' ? [u, v] : null; return; }
  if (e.pointerId !== activeId) return;
  S.preview = [u, v];
  const st = S.stroke; if (!st) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  let added = false;
  for (const ce of (evs.length ? evs : [e])) {
    const [cx2, cy2] = evPos(ce), [u2, v2] = toUnit(cx2, cy2), p = st.pts[st.pts.length - 1];
    if (Math.hypot(u2 - p[0], v2 - p[1]) > 0.006) { st.pts.push([u2, v2]); added = true; }
  }
  if (added) {
    // incremental: draw only the newest segment
    const m = maskC.getContext('2d'), p = st.pts, n = p.length;
    unitXf(m); m.globalCompositeOperation = 'source-over'; m.strokeStyle = '#fff'; m.lineWidth = st.w; m.lineCap = 'round'; m.lineJoin = 'round';
    m.beginPath(); m.moveTo(p[Math.max(0, n - 3)][0], p[Math.max(0, n - 3)][1]); for (let i = Math.max(1, n - 2); i < n; i++) m.lineTo(p[i][0], p[i][1]); m.stroke();
    applyClip();
    const now = performance.now(); if (!S._dl || now - S._dl > 70) { derive(); S._dl = now; }
    if (Math.random() < 0.5) spawnChips(x, y, 1);
  }
}, { passive: false });
function endPointer(e) {
  if (e.pointerId !== activeId) return;
  activeId = null;
  if (S.tool === 'knife') { if (S.stroke) { S.stroke = null; rebuildMask(); } }
  else if (S.preview && e.type === 'pointerup') {
    const [u, v] = S.preview;
    if (Math.abs(u) < 1.6 && Math.abs(v) < 1.5) {
      S.ops.push({ type: 'stamp', kind: S.tool, x: u, y: v, s: stampScale(S.size.stamp) }); rebuildMask();
      const [sx, sy] = toScreen(u, v); spawnChips(sx, sy, 14);
    }
  }
  if (e.pointerType !== 'mouse') S.preview = null;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', (e) => { if (activeId === null && e.pointerType === 'mouse') S.preview = null; });
// stop iOS double-tap zoom / scroll bounce on the stage
cv.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
cv.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

// ---------- UI ----------
function iconCanvas(kind, size = 34) {
  const c = mk(), d = Math.min(window.devicePixelRatio || 1, 3); c.width = c.height = size * d;
  const g = c.getContext('2d'); g.scale(d, d);
  if (kind === 'knife') {
    g.translate(size / 2, size / 2); g.rotate(-0.75);
    g.fillStyle = '#e8e4ee'; g.beginPath(); g.moveTo(-3, -15); g.quadraticCurveTo(6, -6, 4, 4); g.lineTo(-3, 4); g.closePath(); g.fill();
    g.fillStyle = '#8b5a2b'; g.fillRect(-3.5, 4, 8, 12); g.fillStyle = '#c99050'; g.fillRect(-3.5, 4, 3, 12);
    return c;
  }
  g.translate(size / 2, size / 2); const k = size * 0.42; g.scale(k, k);
  if (kind === 'eyes') g.scale(1, 1.4);
  const fill = (cc) => { cc.fillStyle = '#ffc14d'; };
  const tmp = mk(); tmp.width = tmp.height = c.width; const tg = tmp.getContext('2d');
  tg.setTransform(g.getTransform()); fill(tg); drawStampShape(tg, kind);
  tg.setTransform(1, 0, 0, 1, 0, 0); tg.globalCompositeOperation = 'source-in'; tg.fillStyle = '#ffc14d'; tg.fillRect(0, 0, tmp.width, tmp.height);
  g.setTransform(1, 0, 0, 1, 0, 0); g.shadowColor = 'rgba(255,150,30,.8)'; g.shadowBlur = 6; g.drawImage(tmp, 0, 0);
  return c;
}
function pumpkinIcon(shape, color, size = 26) {
  const c = mk(), d = Math.min(window.devicePixelRatio || 1, 3); c.width = c.height = size * d;
  const g = c.getContext('2d'); const save = [S.shape, S.color]; S.shape = shape; S.color = color;
  const sh = SHAPES[shape], k = size * d / (2 * Math.max(sh.sx * 1.04, sh.sy + 0.35) + 0.1);
  g.setTransform(k, 0, 0, k, size * d / 2, size * d / 2 + 0.16 * k); drawPumpkin(g);
  [S.shape, S.color] = save; return c;
}
const tools = $('tools');
function mkTool(id, label) {
  const b = document.createElement('button'); b.className = 'tool'; b.dataset.tool = id; b.title = label;
  b.appendChild(iconCanvas(id)); const s = document.createElement('span'); s.textContent = label; b.appendChild(s);
  b.addEventListener('click', () => setTool(id)); tools.appendChild(b);
}
mkTool('knife', 'Carve');
for (const k of Object.keys(STAMPS)) mkTool(k, STAMPS[k].name);
function setTool(id) {
  S.tool = id;
  for (const b of tools.children) b.classList.toggle('on', b.dataset.tool === id);
  const key = id === 'knife' ? 'knife' : 'stamp';
  $('size').value = S.size[key]; $('sizeLbl').textContent = innerWidth <= 520 ? 'Size' : (id === 'knife' ? 'Knife size' : 'Stamp size');
  showHint(id === 'knife' ? 'Drag on the pumpkin to carve' : `Tap the pumpkin to stamp a ${STAMPS[id].name.toLowerCase()}`);
}
$('size').addEventListener('input', (e) => { S.size[S.tool === 'knife' ? 'knife' : 'stamp'] = +e.target.value; });
const shapesEl = $('shapes'), colorsEl = $('colors');
function buildPickers() {
  shapesEl.querySelectorAll('.chip').forEach((n) => n.remove());
  for (const k of Object.keys(SHAPES)) {
    const b = document.createElement('button'); b.className = 'chip' + (S.shape === k ? ' on' : ''); b.dataset.shape = k; b.title = SHAPES[k].name;
    b.appendChild(pumpkinIcon(k, S.color)); const s = document.createElement('span'); s.textContent = SHAPES[k].name; b.appendChild(s);
    b.addEventListener('click', () => { S.shape = k; buildPickers(); rebuildStatic(); });
    shapesEl.appendChild(b);
  }
  colorsEl.querySelectorAll('.swatch').forEach((n) => n.remove());
  for (const k of Object.keys(COLORS)) {
    const col = COLORS[k], b = document.createElement('button'); b.className = 'swatch' + (S.color === k ? ' on' : ''); b.dataset.color = k; b.title = col.name;
    b.style.background = `radial-gradient(circle at 35% 30%, ${col.light}, ${col.base} 55%, ${col.dark})`;
    b.addEventListener('click', () => { S.color = k; buildPickers(); rebuildStatic(); });
    colorsEl.appendChild(b);
  }
}
function setLights(on) {
  S.lights = on; document.body.classList.toggle('dark', !on);
  $('lightsBtn').setAttribute('aria-pressed', String(!on)); $('lightsLbl').textContent = on ? 'Lights off' : 'Lights on';
  if (!on && S.coverage < 0.0005) showHint('Carve something to let the candlelight out!');
  else if (!on) showHint('Spooky! Keep carving in the dark');
}
$('lightsBtn').addEventListener('click', () => setLights(!S.lights));
function undo() {
  if (!S.ops.length) return; S.ops.pop(); rebuildMask(); toast('Undone');
}
function clearAll() {
  if (!S.ops.length || S.ops[S.ops.length - 1].type === 'clear') return;
  S.ops.push({ type: 'clear' }); rebuildMask(); toast('Fresh pumpkin! (Undo brings it back)');
}
$('undoBtn').addEventListener('click', undo);
$('clearBtn').addEventListener('click', clearAll);
function updateUI() {
  $('undoBtn').disabled = !S.ops.length;
  $('clearBtn').disabled = !S.ops.length || S.ops[S.ops.length - 1].type === 'clear';
}
let hintTimer;
function showHint(text) { const h = $('hint'); h.textContent = text; h.style.opacity = 1; clearTimeout(hintTimer); hintTimer = setTimeout(hideHint, 4200); }
function hideHint() { $('hint').style.opacity = 0; }
let toastTimer;
function toast(text) { const t = $('toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1600); }
window.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (e.key === 'l' || e.key === 'L') setLights(!S.lights);
});

// ---------- surprise face ----------
function surprise(seed) {
  const r = seed != null ? rng(seed) : Math.random, sh = SHAPES[S.shape];
  const ops = [{ type: 'clear' }];
  const eyeY = -0.28 * sh.sy, eyeStyle = Math.floor(r() * 4);
  let eyeTop;
  if (eyeStyle === 0) { const es = 0.9 + r() * 0.5; eyeTop = eyeY - 0.42 * STAMPS.eyes.base * es; ops.push({ type: 'stamp', kind: 'eyes', x: 0, y: eyeY, s: es }); }
  else {
    const kind = ['star', 'moon', 'cat'][eyeStyle - 1], s = kind === 'cat' ? 0.8 + r() * 0.3 : 1.1 + r() * 0.5, gap = 0.36 + r() * 0.1;
    eyeTop = eyeY - STAMPS[kind].base * s;
    ops.push({ type: 'stamp', kind, x: -gap, y: eyeY, s }, { type: 'stamp', kind, x: gap, y: eyeY, s, flip: kind === 'moon' });
  }
  if (r() < 0.75) ops.push({ type: 'stamp', kind: 'nose', x: 0, y: 0.02 * sh.sy, s: 0.9 + r() * 0.4 });
  ops.push({ type: 'stamp', kind: 'grin', x: 0, y: 0.3 * sh.sy, s: 0.9 + r() * 0.45 });
  if (r() < 0.5 && eyeTop - 0.1 > -0.8 * sh.sy) {
    const lift = eyeTop - 0.06;
    ops.push({ type: 'stroke', w: 0.05, pts: [[-0.58, lift + 0.02], [-0.42, lift - 0.06], [-0.22, lift + 0.03]] },
             { type: 'stroke', w: 0.05, pts: [[0.22, lift + 0.03], [0.42, lift - 0.06], [0.58, lift + 0.02]] });
  }
  S.ops.push(...ops); rebuildMask();
  const [x, y] = toScreen(0, 0); spawnChips(x, y, 30);
}
$('surpriseBtn').addEventListener('click', () => { surprise(); toast('Boo! A brand-new face'); });

// ---------- save ----------
function exportCanvas() {
  const ec = mk(); ec.width = cv.width; ec.height = cv.height;
  frame(performance.now(), { ctx: ec.getContext('2d'), clean: true, watermark: true });
  return ec;
}
function dataURLtoBlob(u) {
  const [h, b] = u.split(','), bin = atob(b), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);

}
function fileName() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `pumpkin-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.png`;
}
function download(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Saved ' + name);
}
$('saveBtn').addEventListener('click', () => {
  const url = exportCanvas().toDataURL('image/png'), blob = dataURLtoBlob(url), name = fileName();
  S.lastExport = { name, bytes: blob.size };
  const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (coarse && navigator.canShare) {
    try {
      const file = new File([blob], name, { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'My Pumpkin' }).then(() => toast('Shared!')).catch((err) => { if (err && err.name !== 'AbortError') download(blob, name); });
        return;
      }
    } catch (_) {}
  }
  download(blob, name);
});

// ---------- test/demo hooks ----------
window.__PC__ = {
  S, toScreen, toUnit, surprise, undo, clear: clearAll, setLights, setTool,
  ops: () => S.ops.length, coverage: () => { derive(); return S.coverage; },
  demo() {
    const sh = SHAPES[S.shape];
    S.ops.push({ type: 'clear' },
      { type: 'stamp', kind: 'eyes', x: 0, y: -0.27 * sh.sy, s: 1.15 },
      { type: 'stamp', kind: 'nose', x: 0, y: 0.03, s: 1.0 },
      { type: 'stamp', kind: 'grin', x: 0, y: 0.33 * sh.sy, s: 1.15 },
      { type: 'stroke', w: 0.05, pts: [[-0.62, -0.5], [-0.48, -0.6], [-0.28, -0.56]] },
      { type: 'stroke', w: 0.05, pts: [[0.28, -0.56], [0.48, -0.6], [0.62, -0.5]] },
      { type: 'stamp', kind: 'bat', x: 0, y: -0.64 * sh.sy, s: 0.5 },
      { type: 'stamp', kind: 'star', x: -0.78, y: 0.05, s: 0.6 });
    rebuildMask();
  },
  redraw: () => frame(performance.now()),
};

// ---------- boot ----------
buildPickers(); setTool('knife'); layout();
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
if (window.visualViewport) visualViewport.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
requestAnimationFrame(tick);
showHint('Drag on the pumpkin to carve');
})();
</script>
